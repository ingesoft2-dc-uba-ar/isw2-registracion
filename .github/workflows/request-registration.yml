name: Request registration

# This repo is PUBLIC (so students can file issues without org access).
# It never writes to the roster or touches org membership directly —
# it only proposes a change as a pull request against the private
# isw2-listado-alumnos repo. An admin reviewing/merging that PR is
# what actually grants anything (see isw2-listado-alumnos's
# on-registration-approved.yml). It never comments/closes on its own
# success — the admin closes the issue manually once approved.
#
# Two things every step below is careful about:
#  1. This workflow never checks out its own repo (only the roster
#     repo, into roster-checkout/), so every `gh issue`/`gh pr` call
#     needs an explicit --repo — there's no local git checkout for gh
#     to auto-detect the repo from.
#  2. Free-text values (team_name is student-typed and unconstrained;
#     the validation message can contain markdown backticks) are
#     passed through env: and referenced as "$VAR" in run: scripts,
#     never interpolated directly via ${{ }} into the script text.
#     ${{ }} interpolation happens before bash parses the script, so
#     literal backticks or $() in the value would be re-parsed as
#     shell syntax; env-var expansion of "$VAR" does not re-parse its
#     contents, so this is the safe way to use untrusted text here.
#     (username is exempt from this — it's cross-checked against the
#     issue author's real GitHub login, which GitHub itself already
#     restricts to alphanumerics and hyphens.)

on:
  issues:
    types: [opened, edited, reopened]

env:
  ORG: ingesoft2-dc-uba-ar
  ROSTER_REPO: ingesoft2-dc-uba-ar/isw2-listado-alumnos
  ROSTER_FILE: 2026-2c.yaml   # <-- bump this each cohort (e.g. 2027-1c.yaml)

jobs:
  request:
    if: contains(github.event.issue.labels.*.name, 'registration')
    runs-on: ubuntu-latest
    steps:
      # Local issue comments/closes use the default token (least
      # privilege) — this job only reaches for ORG_ADMIN_TOKEN for the
      # steps that actually need private-repo / cross-repo access.
      - name: Checkout private roster repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ROSTER_REPO }}
          token: ${{ secrets.REGISTRATION_FORKER_TOKEN }}
          path: roster-checkout

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Validate request against roster (dry run against a scratch copy)
        id: reg
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ROSTER_PATH: roster-checkout/${{ env.ROSTER_FILE }}
        run: python3 roster-checkout/scripts/register.py

      - name: Reject (syntactically invalid or breaks a rule)
        if: steps.reg.outputs.status == 'error'
        env:
          GH_TOKEN: ${{ secrets.REGISTRATION_FORKER_TOKEN }}
          MESSAGE: ${{ steps.reg.outputs.message }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "❌ ${MESSAGE}"
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason "not planned"
          gh issue edit "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --add-label "rejected"

      - name: Open approval PR against classroom-roster
        if: steps.reg.outputs.status == 'ok'
        env:
          GH_TOKEN: ${{ secrets.REGISTRATION_FORKER_TOKEN }}
          REG_USERNAME: ${{ steps.reg.outputs.username }}
          REG_TEAMMATE: ${{ steps.reg.outputs.teammate }}
          REG_TEAM_NAME: ${{ steps.reg.outputs.team_name }}
          REG_TEAM_SLUG: ${{ steps.reg.outputs.team_slug }}
          REG_MESSAGE: ${{ steps.reg.outputs.message }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_REPO_FULL: ${{ github.repository }}
        run: |
          cd roster-checkout
          BRANCH="register/issue-${ISSUE_NUMBER}-${REG_USERNAME}"
          git config user.name "classroom-bot"
          git config user.email "classroom-bot@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add "${ROSTER_FILE}"
          git commit -m "Register ${REG_USERNAME} -> ${REG_TEAM_NAME}"
          git push -f origin "$BRANCH"

          # Structured metadata block the roster-side workflow parses
          # back out once this PR is merged/closed.
          BODY=$(cat <<EOF
          Solicitud de inscripción de @${REG_USERNAME}
          para el equipo **${REG_TEAM_NAME}**.

          ${REG_MESSAGE}

          <!-- registration-meta
          username: ${REG_USERNAME}
          teammate: "${REG_TEAMMATE}"
          team_name: "${REG_TEAM_NAME}"
          team_slug: ${REG_TEAM_SLUG}
          issue_repo: ${ISSUE_REPO_FULL}
          issue_number: ${ISSUE_NUMBER}
          -->
          EOF
          )

          EXISTING=$(gh pr list --repo "${ROSTER_REPO}" --head "$BRANCH" --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "PR for $BRANCH already open, updated its branch content above."
          else
            gh pr create --repo "${ROSTER_REPO}" \
              --base main \
              --head "$BRANCH" \
              --title "Registro: ${REG_TEAM_NAME} (${REG_USERNAME})" \
              --body "$BODY"
          fi